<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Profile Form</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h2>CSC584 - Personal Profile Registration</h2>
        <form action="ProfileServlet" method="post">
            <div class="form-group">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName" required placeholder="e.g. Zafran Ahmad">
            </div>

            <div class="form-group">
                <label for="studentId">Student ID:</label>
                <input type="text" id="studentId" name="studentId" required placeholder="e.g. 2024123456">
            </div>

            <div class="form-group">
                <label for="programme">Programme:</label>
                <input type="text" id="programme" name="programme" required placeholder="e.g. CS230 / CS259">
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required placeholder="e.g. student@uitm.edu.my">
            </div>

            <div class="form-group">
                <label for="hobbies">Hobbies:</label>
                <input type="text" id="hobbies" name="hobbies" required placeholder="e.g. Coding, Gaming, Reading">
            </div>

            <div class="form-group">
                <label for="bio">Short Self-Introduction:</label>
                <textarea id="bio" name="bio" rows="4" required placeholder="Tell us a little bit about yourself..."></textarea>
            </div>

            <button type="submit" class="btn">Submit Profile</button>
        </form>
    </div>
</body>
</html>
